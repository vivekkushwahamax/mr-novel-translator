<script>
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');
    let originalFileName = "Translated_Hindi.txt";
    let fileLines = [];
    let currentLineIndex = 0;
    const CHUNK_SIZE = 200; // एक बार में 200 लाइनें लोड होंगी ताकि लैग न हो

    fileInput.onchange = () => {
        if(fileInput.files[0]) {
            const name = fileInput.files[0].name;
            document.getElementById('info').innerHTML = "✅ Selected: " + name + "<br><small>Ab 'Load & Translate' button dabayein</small>";
            originalFileName = "Hindi_" + name;
        }
    };

    function readFile() {
        const file = fileInput.files[0];
        if (!file) return alert("Pehle English ya Chinese .txt file select karein!");

        output.innerText = "Failing loading & splitting large file... Kripya thoda intezaar karein.";
        
        const reader = new FileReader();
        reader.onload = (e) => {
            output.classList.remove('notranslate');
            const text = e.target.result;
            
            // बड़ी फ़ाइल को लाइनों में तोड़ना ताकि लैग न हो
            fileLines = text.split(/\r?\n/);
            currentLineIndex = 0;
            output.innerText = "";
            
            loadNextChunk();

            window.scrollTo(0, 0);
            output.scrollTop = 0;
        };
        reader.readAsText(file, 'UTF-8');
    }

    // धीरे-धीरे हिस्से लोड करने का फंक्शन (Lag-free)
    function loadNextChunk() {
        if (currentLineIndex >= fileLines.length) return;

        const chunk = fileLines.slice(currentLineIndex, currentLineIndex + CHUNK_SIZE).join("\n");
        output.innerText += chunk + "\n";
        currentLineIndex += CHUNK_SIZE;

        // अगर अभी और डेटा बाकी है, तो अगले चंक को थोड़ा डिले देकर लोड करें
        if (currentLineIndex < fileLines.length) {
            setTimeout(loadNextChunk, 300);
        } else {
            alert("6MB ki file successfully load ho chuki hai!\n\nGoogle Translate background me ise Hindi me convert kar raha hai.");
        }
    }

    function saveFile() {
        const text = output.innerText;
        if(text.includes("File content will appear here") || text.includes("यहाँ आपकी फाइल")) {
            return alert("Pehle file load karein aur translate hone ka wait karein!");
        }

        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = originalFileName;
        link.click();
    }
</script>
