<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Translate EPUB & TXT Pro</title>
    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 950px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1e40af; text-align: center; margin-top: 0; }
        
        #google_translate_element {
            background: #fff; padding: 10px; border-radius: 8px; text-align: center;
            margin-bottom: 20px; border: 1px solid #d1d5db;
        }

        .drop-zone {
            border: 2px dashed #3b82f6; padding: 25px; text-align: center;
            border-radius: 12px; cursor: pointer; background: #eff6ff; margin-bottom: 20px;
        }

        #output {
            width: 100%; 
            min-height: 400px;
            padding: 25px;
            border: 1px solid #cbd5e1; 
            border-radius: 10px;
            background: #ffffff; 
            font-size: 18px; 
            line-height: 1.8;
            margin-bottom: 15px;
            overflow: visible; 
            white-space: pre-wrap;
        }

        .btn-box { position: sticky; bottom: 20px; display: flex; gap: 10px; background: rgba(240,244,248,0.9); padding: 10px; border-radius: 10px; z-index: 100; flex-wrap: wrap; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 140px; }
        .load-btn { background: #2563eb; color: white; }
        .save-btn { background: #059669; color: white; }
        .scroll-btn { background: #f59e0b; color: white; }
        
        .status-bar { text-align: center; font-size: 14px; color: #1e40af; font-weight: bold; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart EPUB & TXT Translator Pro</h2>

    <!-- Adsterra Banner Ad Unit (300x250) -->
    <div style="text-align:center; margin-bottom:20px;">
        <script type="text/javascript">
            atOptions = {
                'key' : '71690fec8e71e33020125f0e537b756a',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/71690fec8e71e33020125f0e537b756a/invoke.js"></script>
    </div>
    <!-- End Adsterra Banner Ad -->

    <div id="google_translate_element"></div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <b id="info">📂 Upload EPUB or TXT File (English / Chinese)</b>
        <input type="file" id="fileInput" accept=".epub,.txt">
    </div>

    <div id="statusBar" class="status-bar">Processing... please wait...</div>
    
    <div id="output" class="notranslate">Kitab ya file ka content yahan load hoga...</div>

    <div class="btn-box">
        <button class="load-btn" onclick="readFile()">1. Load File</button>
        <button class="scroll-btn" onclick="autoScroll()">2. Auto-Scan for Translation</button>
        <button class="save-btn" onclick="saveAsTxt()">3. Download Hindi File</button>
    </div>

    <!-- Adsterra Native Banner Ad Unit -->
    <div style="margin-top:20px;">
        <script async="async" data-cfasync="false" src="https://pl31020269.profitableratecpmnetwork.com/41d6e43f8ea617a9c49f629080069b48/invoke.js"></script>
        <div id="container-41d6e43f8ea617a9c49f629080069b48"></div>
    </div>
    <!-- End Adsterra Native Banner -->
</div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'auto', 
            includedLanguages: 'hi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: true,
            multilanguagePage: true
        }, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const statusBar = document.getElementById('statusBar');

    fileInput.onchange = () => {
        if(fileInput.files[0]) {
            document.getElementById('info').innerHTML = "✅ Selected: " + fileInput.files[0].name + "<br><small>Ab 'Load File' button dabayein</small>";
        }
    };

    async function readFile() {
        const file = fileInput.files[0];
        if (!file) return alert("Pehle EPUB ya TXT file chunein!");

        statusBar.style.display = "block";
        statusBar.innerText = "Reading File Data...";
        output.innerHTML = "";
        output.classList.add('notranslate');
        
        const fileName = file.name.toLowerCase();

        if (fileName.endsWith('.epub')) {
            try {
                const zip = await JSZip.loadAsync(file);
                const htmlFiles = Object.keys(zip.files)
                    .filter(name => name.endsWith('.html') || name.endsWith('.xhtml'))
                    .sort();

                let fullHTML = "";
                for (let fName of htmlFiles) {
                    const content = await zip.files[fName].async("text");
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(content, 'text/html');
                    const text = doc.body.innerText;
                    if(text.trim().length > 5) {
                        fullHTML += text + "\n\n";
                    }
                }

                output.innerText = fullHTML;
                output.classList.remove('notranslate');
                statusBar.innerText = "EPUB Loaded! Click 'Auto-Scan' to trigger translation.";
                alert("EPUB load ho gayi hai. Ab 'Auto-Scan' button dabayein.");
            } catch (err) {
                alert("EPUB read karne mein error!");
                statusBar.style.display = "none";
            }
        } else if (fileName.endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                output.classList.remove('notranslate');
                output.innerText = e.target.result;
                statusBar.innerText = "TXT Loaded! Click 'Auto-Scan' to trigger translation.";
                alert("TXT file load ho gayi hai. Ab 'Auto-Scan' button dabayein.");
            };
            reader.readAsText(file, 'UTF-8');
        } else {
            alert("Kewal .epub aur .txt files hi supported hain!");
            statusBar.style.display = "none";
        }
    }

    function autoScroll() {
        if(output.innerText.length < 50) return alert("Pehle file load karein!");
        
        statusBar.innerText = "Auto-Scanning for translation... please wait.";
        let distance = 400;
        let delay = 100;

        let timer = setInterval(() => {
            window.scrollBy(0, distance);
            if ((window.innerHeight + window.pageYOffset) >= document.body.offsetHeight) {
                clearInterval(timer);
                window.scrollTo(0, 0);
                statusBar.innerText = "Scanning Complete! Google Translate should now process the whole text.";
                alert("Scan pura hua! Ab aap download kar sakte hain.");
            }
        }, delay);
    }

    function saveAsTxt() {
        const text = output.innerText;
        if(text.includes("Kitab ya file ka content")) {
            return alert("Pehle file load karein!");
        }
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "Hindi_" + (fileInput.files[0] ? fileInput.files[0].name.replace(/\.[^/.]+$/, ".txt") : "Translated.txt");
        link.click();
    }
</script>

</body>
</html>
